name: Release

# QA-5: al empujar una etiqueta vX.Y.Z se compila el APK de release, se firma
# con la llave de los secretos y se publica en los Releases con su SHA-256.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que estén los secretos de firma
        env:
          KS: ${{ secrets.PAYNANI_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.PAYNANI_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.PAYNANI_KEY_ALIAS }}
          KP: ${{ secrets.PAYNANI_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing PAYNANI_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing PAYNANI_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing PAYNANI_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing PAYNANI_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos de firma:$missing. No se publica un APK sin firmar."
            exit 1
          fi

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle con caché
        uses: gradle/actions/setup-gradle@v4

      - name: Escribir la llave de firma
        env:
          KS: ${{ secrets.PAYNANI_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/paynani.jks"
          chmod 600 "$RUNNER_TEMP/paynani.jks"

      - name: Compilar y firmar
        env:
          PAYNANI_KEYSTORE_FILE: ${{ runner.temp }}/paynani.jks
          PAYNANI_KEYSTORE_PASSWORD: ${{ secrets.PAYNANI_KEYSTORE_PASSWORD }}
          PAYNANI_KEY_ALIAS: ${{ secrets.PAYNANI_KEY_ALIAS }}
          PAYNANI_KEY_PASSWORD: ${{ secrets.PAYNANI_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # versionCode = aaaammdd + el cuarto de hora UTC del día, 00 a 95 (2026110290 a las 22:30).
          # Antes eran los dos últimos dígitos de la corrida, pero PaynaniApp y PaynaniApp-Agentic
          # son la misma app (mismo applicationId) con contadores de corrida distintos: la v1.0.0,
          # corrida 1, salió con 2026110201, menor que la 0.13.0 de la Agentic (2026110227), y
          # Android no la instaló encima (PaynaniApp-Agentic#175). Con la hora, el código crece
          # igual en los dos repos; dos releases en el mismo cuarto de hora dan el mismo código, y
          # Android acepta un código igual como actualización. Sigue debajo de 2,100,000,000.
          QUARTER=$(( (10#$(date -u +%H) * 60 + 10#$(date -u +%M)) / 15 ))
          CODE="$(date -u +%Y%m%d)$(printf '%02d' "$QUARTER")"
          ./gradlew assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode="$CODE"
          APK="PaynaniApp-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          sha256sum "$APK" > "$APK.sha256"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Borrar la llave
        if: always()
        run: rm -f "$RUNNER_TEMP/paynani.jks"

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUM="$(cut -d' ' -f1 "$APK.sha256")"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "PaynaniApp $GITHUB_REF_NAME" \
            --notes "APK firmado. SHA-256: \`$SUM\`. Instalación: INSTALL.md de iaaorgmx/paynani, sección del teléfono."
